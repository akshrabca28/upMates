<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>UpMates | Sign Up</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="signup-container">

        <div class="signup-card">

            <div class="brand-name">UpMates</div>

            <h2>Create Your Account</h2>

            <p class="subtitle">
                Join UpMates and start your journey!
            </p>

            <form>

                <div class="mb-3">
                    <label for="fullname" class="form-label">
                        Full Name
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="fullname"
                        placeholder="Enter your full name"
                    >
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">
                        Email Address
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        placeholder="Enter your email"
                    >
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">
                        Password
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        placeholder="Create a password"
                    >
                </div>

                <div class="mb-4">
                    <label for="confirmPassword" class="form-label">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                    >
                </div>

                <button type="button" class="btn signup-btn w-100">
                    Sign Up
                </button>

            </form>

            <p class="login-text">
                Already have an account?
                <a href="#">Login</a>
            </p>

        </div>

    </div>

</body>
</html>
